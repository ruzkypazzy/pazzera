version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pazzera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pazzera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pazzera}
      POSTGRES_DB: ${POSTGRES_DB:-pazzera}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/backup-postgres.sh:/backup/backup-postgres.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pazzera} -d ${POSTGRES_DB:-pazzera}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pazzera-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: pazzera-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pazzera}:${POSTGRES_PASSWORD:-pazzera}@postgres:5432/${POSTGRES_DB:-pazzera}?schema=public
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      # Bind-mount a host directory as the local storage root so
      # PM2 workers (running on the host) can read the same files
      # the web container wrote. Path is stable; both web and
      # host workers see the same bytes.
      - /opt/pazzera/.local-storage:/tmp/pazzera-uploads

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: pazzera-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pazzera}:${POSTGRES_PASSWORD:-pazzera}@postgres:5432/${POSTGRES_DB:-pazzera}?schema=public
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Same local storage root as the web container, so the worker
      # can read the audio/cover files the web container wrote.
      - /opt/pazzera/.local-storage:/tmp/pazzera-uploads
    command: ["node_modules/.bin/tsx", "packages/agents/src/workers/run.ts"]

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local